[package]
name = "agents-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agents-core = { path = "../agents-core" }
agents-auth = { path = "../agents-auth" }
worker = { version = "0.8.7", features = ["d1"] }
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen = "0.6"
futures = "0.3"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Request", "RequestInit", "WorkerGlobalScope", "Crypto", "SubtleCrypto", "CryptoKey", "EcKeyImportParams", "EcdsaParams"] }
uuid = { version = "1", features = ["v4", "js"] }
sha2.workspace = true
hmac = "0.12"
base64 = "0.22"
percent-encoding = "2"
console_error_panic_hook = "0.1"
eventsource-stream = "0.2"
url = "2"
jsonschema = { version = "0.49.9", default-features = false, features = ["arbitrary-precision"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
rmcp = { version = "3.7.0", default-features = false }
llguidance = { path = "../../third_party/llguidance", default-features = false, features = ["lark", "wasm"] }

time = { version = "0.3", default-features = false }
deepseek-recipe = { path = "../../third_party/deepseek-recipe/deepseek-recipe" }
deepseek-recipe-core = { path = "../../third_party/deepseek-recipe/deepseek-recipe-core" }
deepseek-recipe-encoding = { path = "../../third_party/deepseek-recipe/deepseek-recipe-encoding" }
tokenizers = { version = "=0.23.2", default-features = false, features = ["unstable_wasm"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
minijinja = { version = "3.0.3", default-features = false, features = ["builtins", "serde", "fuel"] }

text-splitter = { version = "=0.33.1", default-features = false }

[dev-dependencies]
proptest = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
instant = { version = "0.1.13", features = ["wasm-bindgen"] }
