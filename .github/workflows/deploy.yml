name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        required: true
      source_run:
        description: Successful CI run ID for this exact commit
        type: string
        required: true

permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      SOURCE_RUN: ${{ inputs.source_run }}
      DEPLOY_CONFIG: .temp/deploy.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require successful CI for this exact source
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          const repository = process.env.GITHUB_REPOSITORY;
          const source = process.env.SOURCE_RUN;
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository ?? '')
            || !/^[1-9][0-9]{0,14}$/.test(source ?? '')) throw Error('Invalid CI repository or run ID');
          const api = path => JSON.parse(execFileSync('gh', ['api', `repos/${repository}/${path}`], {
            encoding: 'utf8', maxBuffer: 2 * 1024 * 1024,
          }));
          const r = api(`actions/runs/${source}`);
          if (r.id !== Number(source) || r.repository?.full_name !== repository
            || r.head_repository?.full_name !== repository || r.status !== 'completed'
            || r.head_sha!==process.env.GITHUB_SHA || r.conclusion!=="success"
            || r.path!==".github/workflows/ci.yml" || r.event==="pull_request"
            || !['push', 'workflow_dispatch'].includes(r.event)
            || r.display_title?.startsWith('Worker diagnostics - ')) {
            throw Error('CI source/run is not approved for deployment');
          }
          const page = api(`actions/runs/${source}/jobs?filter=latest&per_page=100`);
          if (!Array.isArray(page.jobs) || !Number.isInteger(page.total_count)
            || page.total_count > 100 || page.jobs.length !== page.total_count) {
            throw Error('CI job list is incomplete or exceeds the release bound');
          }
          for (const name of ['changes', 'rust', 'worker', 'dashboard', 'container', 'tooling']) {
            const jobs = page.jobs.filter(job => job.name === name);
            if (jobs.length !== 1 || jobs[0].run_id !== r.id || jobs[0].head_sha !== r.head_sha
              || jobs[0].status !== 'completed' || jobs[0].conclusion !== 'success') {
              throw Error(`Required release job is not successful: ${name}`);
            }
          }
          NODE
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Require environment-paired credentials before changing infrastructure
        env:
          IDENTITY_CLIENT_PRIVATE_JWK: ${{ inputs.environment == 'staging' && secrets.STAGING_IDENTITY_CLIENT_PRIVATE_JWK || inputs.environment == 'production' && secrets.PRODUCTION_IDENTITY_CLIENT_PRIVATE_JWK || '' }}
          DATA_ENCRYPTION_KEY: ${{ inputs.environment == 'staging' && secrets.STAGING_DATA_ENCRYPTION_KEY || inputs.environment == 'production' && secrets.PRODUCTION_DATA_ENCRYPTION_KEY || '' }}
        run: |
          test -n "$IDENTITY_CLIENT_PRIVATE_JWK" || { echo 'Missing registered client signing key'; exit 1; }
          test -n "$DATA_ENCRYPTION_KEY" || { echo 'Missing data-encryption key'; exit 1; }
      - name: Require staging acceptance credentials before changing infrastructure
        if: inputs.environment == 'staging'
        env:
          MAGENTS_TEST_API_KEY: ${{ secrets.STAGING_SMOKE_API_KEY }}
          MAGENTS_TEST_OTHER_API_KEY: ${{ secrets.STAGING_SECONDARY_API_KEY }}
        run: |
          test -n "$MAGENTS_TEST_API_KEY" || { echo 'Missing staging acceptance credential'; exit 1; }
          test -n "$MAGENTS_TEST_OTHER_API_KEY" || { echo 'Missing secondary staging tenant credential'; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker
          path: crates/agents-worker/build
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dashboard
          path: apps/dashboard/dist
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: container-image
          path: .temp/container-release
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: Verify and load the exact tested container
        run: node scripts/container-artifact.mjs load .temp/container-release
      - name: Publish tested container before changing Worker code
        run: npx wrangler containers push "magents-workspace:${GITHUB_SHA}"
      - name: Render immutable deployment configuration
        run: node scripts/deploy-config.mjs
      - name: Migrate only the selected environment
        run: npx wrangler d1 migrations apply DB --remote --env "$DEPLOY_ENVIRONMENT" --config .temp/deploy.json
      - name: Deploy source and immutable container
        run: npx wrangler deploy --env "$DEPLOY_ENVIRONMENT" --config .temp/deploy.json
      - name: Sync environment-paired credentials
        env:
          IDENTITY_CLIENT_PRIVATE_JWK: ${{ inputs.environment == 'staging' && secrets.STAGING_IDENTITY_CLIENT_PRIVATE_JWK || inputs.environment == 'production' && secrets.PRODUCTION_IDENTITY_CLIENT_PRIVATE_JWK || '' }}
          DATA_ENCRYPTION_KEY: ${{ inputs.environment == 'staging' && secrets.STAGING_DATA_ENCRYPTION_KEY || inputs.environment == 'production' && secrets.PRODUCTION_DATA_ENCRYPTION_KEY || '' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/worker-secrets.mjs "$DEPLOY_ENVIRONMENT"
      - name: Enforce opt-in diagnostic retention
        run: npx wrangler r2 bucket lifecycle set "moesegfault-agents-diagnostics-${DEPLOY_ENVIRONMENT}" --file deploy/r2-diagnostics-lifecycle.json --force
      - name: Public deployed boundary smoke
        run: |
          if [ "$DEPLOY_ENVIRONMENT" = staging ]; then host=agents-staging.moesegfault.dev; else host=agents.moesegfault.dev; fi
          curl --fail --retry 5 --retry-delay 5 "https://${host}/healthz" | jq --exit-status --arg build "$GITHUB_SHA" '.status == "ok" and .build_id == $build'
          status=$(curl -s -o /dev/null -w '%{http_code}' "https://${host}/v1/agents")
          test "$status" = 401
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: inputs.environment == 'staging'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.lock
      - name: Authenticated user journey
        if: inputs.environment == 'staging'
        env:
          MAGENTS_TEST_API_ORIGIN: https://agents-staging.moesegfault.dev
          MAGENTS_TEST_API_KEY: ${{ secrets.STAGING_SMOKE_API_KEY }}
          MAGENTS_TEST_OTHER_API_KEY: ${{ secrets.STAGING_SECONDARY_API_KEY }}
          MAGENTS_TEST_INFERENCE: '1'
          MAGENTS_TEST_WORKSPACE: '1'
          MAGENTS_TEST_QUOTA: '1'
          MAGENTS_TEST_COMPACTION: '1'
          MAGENTS_TEST_REQUIRE_ALL: '1'
          MAGENTS_TEST_TRACE_SEED: ${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          test -n "$MAGENTS_TEST_API_KEY" || { echo 'Missing staging acceptance credential'; exit 1; }
          test -n "$MAGENTS_TEST_OTHER_API_KEY" || { echo 'Missing secondary staging tenant credential'; exit 1; }
          python3 -m venv .cache/e2e-venv
          .cache/e2e-venv/bin/pip install -r tests/e2e/requirements.lock
          .cache/e2e-venv/bin/python -m pytest tests/e2e/test_deployed.py tests/e2e/test_responses.py tests/e2e/test_space.py -ra -o cache_dir=.cache/pytest --basetemp=.temp/pytest
          node tests/e2e/responses-sdk.mjs
