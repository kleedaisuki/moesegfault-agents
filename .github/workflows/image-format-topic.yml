name: Real image format repair
on:
  push:
    branches: [codex/image-runtime]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-format-${{ github.ref }}
  cancel-in-progress: false
jobs:
  jpeg-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c
        with:
          shared-key: worker
          cache-on-failure: true
      - name: Only the real-shape provider-default JPEG regression
        run: |
          set -euo pipefail
          mkdir -p .temp/image-format
          cargo test --locked -p agents-worker --lib service_default_jpeg_keeps_completed_identity_cost_and_real_format -- --nocapture 2>&1 | tee .temp/image-format/jpeg.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: image-format-receipt
          path: .temp/image-format/jpeg.log
          retention-days: 14
