name: Package magents

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and attach assets (empty means artifacts only)
        type: string
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: magents-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || '' }}

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ (github.event.release.tag_name || inputs.release_tag) && format('refs/tags/{0}', github.event.release.tag_name || inputs.release_tag) || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: magents-release-${{ matrix.target }}
      - name: Read the actual package version and validate release tag
        shell: python
        run: |
          import json, os, subprocess
          metadata = json.loads(subprocess.check_output([
              "cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"
          ], text=True))
          version = next(p["version"] for p in metadata["packages"] if p["name"] == "magents")
          tag = os.environ.get("RELEASE_TAG", "")
          if tag and tag != f"v{version}":
              raise SystemExit(f"Release tag {tag!r} does not match magents v{version}")
          if tag:
              tagged = subprocess.check_output(["git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}"], text=True).strip()
              checked_out = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              if tagged != checked_out:
                  raise SystemExit("Checked-out source does not match the requested release tag")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"PACKAGE_VERSION={version}\n")
      - name: Test real CLI journeys on the native platform
        run: cargo test --locked --release -p magents --target "$TARGET"
      - name: Build the distributable binary
        run: cargo build --locked --release -p magents --target "$TARGET"
      - name: Verify and package binary with source metadata
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess, tarfile, zipfile
          version, target = os.environ["PACKAGE_VERSION"], os.environ["TARGET"]
          filename = "magents.exe" if target.endswith("windows-msvc") else "magents"
          binary = pathlib.Path("target") / target / "release" / filename
          actual = subprocess.check_output([str(binary.resolve()), "--version"], text=True).strip()
          if actual != f"magents {version}":
              raise SystemExit(f"Binary version mismatch: {actual!r}")
          subprocess.run([str(binary.resolve()), "skills", "--help"], check=True)
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          stage = pathlib.Path(".temp") / f"magents-{target}"
          stage.mkdir(parents=True, exist_ok=True)
          info = stage / "BUILD-INFO.json"
          info.write_text(json.dumps({
              "package": "magents", "version": version, "target": target,
              "commit": commit, "source_ref": f"refs/tags/{os.environ['RELEASE_TAG']}" if os.environ.get("RELEASE_TAG") else os.environ["GITHUB_REF"],
              "workflow_run": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "rustc": subprocess.check_output(["rustc", "--version"], text=True).strip()
          }, indent=2) + "\n", encoding="utf-8")
          out = pathlib.Path("dist")
          out.mkdir(exist_ok=True)
          stem = f"magents-{version}-{target}"
          members = [(binary, filename), (pathlib.Path("LICENSE"), "LICENSE"), (info, "BUILD-INFO.json")]
          if filename.endswith(".exe"):
              archive = out / f"{stem}.zip"
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as package:
                  for source, name in members:
                      package.write(source, name)
          else:
              archive = out / f"{stem}.tar.gz"
              with tarfile.open(archive, "w:gz") as package:
                  for source, name in members:
                      package.add(source, arcname=name, recursive=False)
          digest = hashlib.sha256()
          with archive.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  digest.update(chunk)
          checksum = digest.hexdigest()
          archive.with_name(archive.name + ".sha256").write_bytes(f"{checksum}  {archive.name}\n".encode("ascii"))
          print(f"Packaged {archive.name}: {checksum}")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: magents-${{ env.PACKAGE_VERSION }}-${{ matrix.target }}
          path: dist/magents-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  attach:
    name: Attach assets to the existing release
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: package
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: magents-*
          path: dist
          merge-multiple: true
      - name: Validate checksums before uploading
        working-directory: dist
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 2
          sha256sum --check *.sha256
      - name: Attach without creating releases or replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/*
