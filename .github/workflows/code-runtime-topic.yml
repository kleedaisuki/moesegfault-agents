name: Code runtime increment
on:
  push:
    branches: [codex/code-runtime]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: code-runtime-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CODE_RUNTIME_CASE_PATTERN: 'BYOK Code executor'
jobs:
  code-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c
        with:
          shared-key: worker
          cache-all-crates: true
          cache-on-failure: true
      - run: cargo fmt -p agents-worker --check
      - name: Only the new frozen-resource identity regression
        run: |
          set -euo pipefail
          mkdir -p .temp/code-runtime
          cargo test --locked -p agents-worker --lib code_reuse_rejects_memory_backend_and_executor_identity_changes_before_prepare -- --nocapture 2>&1 | tee .temp/code-runtime/rust.log
      - run: cargo check --locked -p agents-worker --target wasm32-unknown-unknown
      - run: cargo install --locked worker-build --version 0.8.7
      - run: worker-build --release
        working-directory: crates/agents-worker
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/bundle-worker.mjs
        id: bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' }}
        with:
          name: worker
          path: crates/agents-worker/build
          retention-days: 7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/e2e/requirements-current.lock
      - name: Locked current SDK wire schema
        run: |
          python3 -m venv .cache/e2e-current-venv
          .cache/e2e-current-venv/bin/pip install -r tests/e2e/requirements-current.lock
      - name: Only the new separate-credential BYOK Code journey
        env:
          MAGENTS_CURRENT_SCHEMA_PYTHON: .cache/e2e-current-venv/bin/python
          MAGENTS_TEST_EXPECTED_BUILD: ${{ github.sha }}
        run: |
          set -euo pipefail
          node --test --test-reporter=tap "--test-name-pattern=$CODE_RUNTIME_CASE_PATTERN" tests/worker/hosted-code.test.mjs 2>&1 | tee .temp/code-runtime/worker.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: code-runtime-receipts
          include-hidden-files: true
          path: |
            .temp/code-runtime/*.log
            .temp/hosted-code-*/receipt.json
          retention-days: 14
          if-no-files-found: warn

  native-executor:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: container/Dockerfile
          load: true
          tags: magents-workspace:acceptance
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,mode=max,scope=workspace
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.lock
      - name: Only new authenticated actual-capability and boot-proof contract
        env:
          MAGENTS_DAEMON_IMAGE: magents-workspace:acceptance
        run: |
          set -euo pipefail
          python3 -m venv .cache/e2e-venv
          .cache/e2e-venv/bin/pip install -r tests/e2e/requirements.lock
          mkdir -p .temp/code-executor
          .cache/e2e-venv/bin/python -m pytest 'tests/e2e/test_workspace_code_executor.py::test_executor_capabilities_and_atomic_prepare_boot_match_actual_instance[4g]' -ra -rP --basetemp=.temp/pytest-code-executor -o cache_dir=.cache/pytest 2>&1 | tee .temp/code-executor/native.log
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Retain the exact new executor image
        run: |
          mkdir -p .cache/code-executor-image
          docker image tag magents-workspace:acceptance "magents-workspace:${GITHUB_SHA}"
          docker image save "magents-workspace:${GITHUB_SHA}" | gzip -n -1 > .cache/code-executor-image/image.tar.gz
          node scripts/container-artifact.mjs create .cache/code-executor-image
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: container-image
          path: .cache/code-executor-image
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: code-executor-native-receipts
          path: .temp/code-executor/*.log
          include-hidden-files: true
          retention-days: 14

  real-executor-journey:
    needs: code-runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: worker
          path: crates/agents-worker/build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: container-image
          path: .cache/code-executor-image
          run-id: 40324162172
          github-token: ${{ github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/e2e/requirements-current.lock
      - run: |
          python3 -m venv .cache/e2e-current-venv
          .cache/e2e-current-venv/bin/pip install -r tests/e2e/requirements-current.lock
      - name: Load the accepted image without rebuilding or replaying its native test
        run: |
          node --input-type=module -e 'import {loadImageArtifact} from "./scripts/container-artifact.mjs"; await loadImageArtifact(".cache/code-executor-image","7c2692092e40d3a5594d57b935552c24e5080c87")'
      - name: Start an authenticated dedicated real Python executor
        run: |
          set -euo pipefail
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "MAGENTS_CODE_EXECUTOR_TOKEN=$token" >> "$GITHUB_ENV"
          docker run --detach --name code-executor --memory 4g --memory-swap 4g --publish 127.0.0.1::8080 --env "MAGENTS_DAEMON_TOKEN=$token" magents-workspace:7c2692092e40d3a5594d57b935552c24e5080c87
          address=$(docker port code-executor 8080/tcp)
          echo "MAGENTS_CODE_EXECUTOR_ORIGIN=http://$address" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl --silent --fail -H "Authorization: Bearer $token" "http://$address/health" > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: New compiled Rust Worker to actual executor Python and artifact journey
        env:
          MAGENTS_CURRENT_SCHEMA_PYTHON: .cache/e2e-current-venv/bin/python
          MAGENTS_TEST_EXPECTED_BUILD: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .temp/code-executor-real
          node --test --test-reporter=tap --test-name-pattern='real BYOK executor Python' tests/worker/hosted-code.test.mjs 2>&1 | tee .temp/code-executor-real/worker.log
      - name: Stop only the dedicated test instance
        if: always()
        run: docker rm --force code-executor || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: code-executor-real-receipts
          path: |
            .temp/code-executor-real/*.log
            .temp/hosted-code-*/receipt.json
          include-hidden-files: true
          retention-days: 14
