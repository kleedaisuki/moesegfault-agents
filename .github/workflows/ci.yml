name: CI
run-name: ${{ inputs.diagnostic_run != '' && format('Worker diagnostics - {0}', inputs.diagnostic_run) || format('CI - {0}', github.sha) }}
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnostic_run:
        description: Reuse a completed CI Worker artifact for fixture diagnostics only (empty runs full CI)
        type: string
        required: false
        default: ''

permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.diagnostic_run || 'build' }}
  cancel-in-progress: ${{ !inputs.diagnostic_run }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  changes:
    if: ${{ !inputs.diagnostic_run }}
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      worker: ${{ steps.paths.outputs.worker }}
      dashboard: ${{ steps.paths.outputs.dashboard }}
      container: ${{ steps.paths.outputs.container }}
      tooling: ${{ steps.paths.outputs.tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/ci-changes.mjs

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
        with:
          shared-key: native
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace --exclude agents-worker
      - run: python3 -m unittest discover -s tests -p 'test_*sql.py' -v
      - run: cargo clippy --locked --workspace --exclude agents-worker --all-targets -- -D warnings
      - name: Retain native performance measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: performance-native-v3
          path: .cache/perf/v3/*.json
          if-no-files-found: warn
          retention-days: 7

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Use the runner's installed Chrome
        run: |
          chrome=$(command -v google-chrome)
          "$chrome" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard
          path: apps/dashboard/dist
          retention-days: 7

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c
        with:
          shared-key: worker
          cache-all-crates: true
          cache-on-failure: true
      - run: cargo check --locked -p agents-worker --target wasm32-unknown-unknown
      - run: cargo test --locked -p agents-worker --lib
      - run: cargo install --locked worker-build --version 0.8.7
      - run: worker-build --release
        working-directory: crates/agents-worker
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/bundle-worker.mjs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.lock
      - name: Install the strict SDK wire-schema validator
        run: |
          python3 -m venv .cache/e2e-venv
          .cache/e2e-venv/bin/pip install -r tests/e2e/requirements.lock
      - run: npm run test:worker
        env:
          MAGENTS_SCHEMA_PYTHON: .cache/e2e-venv/bin/python
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: performance-v3
          path: .cache/perf/v3/*.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: worker
          path: crates/agents-worker/build
          retention-days: 7

  container:
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: container/Dockerfile
          load: true
          tags: magents-workspace:acceptance
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,mode=max,scope=workspace
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.lock
      - run: |
          python3 -m venv .cache/e2e-venv
          .cache/e2e-venv/bin/pip install -r tests/e2e/requirements.lock
          .cache/e2e-venv/bin/python -m pytest tests/e2e/test_workspace_daemon.py tests/e2e/test_workspace_interpreter.py -ra -rP -o cache_dir=.cache/pytest --basetemp=.temp/pytest
        env:
          MAGENTS_DAEMON_IMAGE: magents-workspace:acceptance
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Save the exact tested container for promotion
        run: |
          set -euo pipefail
          mkdir -p .temp/container-release
          docker image tag magents-workspace:acceptance "magents-workspace:${GITHUB_SHA}"
          docker image save "magents-workspace:${GITHUB_SHA}" | gzip -n -1 > .temp/container-release/image.tar.gz
          node scripts/container-artifact.mjs create .temp/container-release
          node scripts/container-artifact.mjs load .temp/container-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: container-image
          path: .temp/container-release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  tooling:
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run test:tooling
      - run: node --test tests/e2e/paid-route-policy.test.mjs tests/e2e/test_full_responses_sdk_contract.mjs
      - run: node --test scripts/perf/v3-*.test.mjs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.lock
      - run: |
          python3 -m venv .cache/e2e-venv
          .cache/e2e-venv/bin/pip install -r tests/e2e/requirements.lock
          .cache/e2e-venv/bin/python -m pytest tests/e2e/test_sdk_contract.py tests/e2e/test_responses_contract.py tests/e2e/test_responses_observation.py tests/e2e/test_paid_route_policy.py tests/e2e/test_python_kernel_bridge.py tests/e2e/test_daemon_harness.py tests/e2e/test_cleanup.py scripts/perf/test_measure.py -ra -o cache_dir=.cache/pytest --basetemp=.temp/pytest
          .cache/e2e-venv/bin/python -m pytest tests/e2e/test_deployed.py tests/e2e/test_responses.py tests/e2e/test_space.py --collect-only -q -o cache_dir=.cache/pytest
      - name: Verify current SDK HTTP and WebSocket contracts separately from legacy clients
        run: |
          python3 -m venv .cache/e2e-current-venv
          .cache/e2e-current-venv/bin/pip install -r tests/e2e/requirements-current.lock
          .cache/e2e-current-venv/bin/pip check
          .cache/e2e-current-venv/bin/python -m pytest tests/e2e/test_current_responses_sdk_contract.py -ra -o cache_dir=.cache/pytest-current --basetemp=.temp/pytest-current

  # Fixture revisions may target a retained older binary; this is never release CI.
  diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Verify diagnostic artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.diagnostic_run }}
        run: node scripts/worker-diagnostic.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker
          path: .cache/worker-diagnostic/build
          run-id: ${{ inputs.diagnostic_run }}
          github-token: ${{ github.token }}
      - name: Require the complete compiled artifact
        run: |
          test -s .cache/worker-diagnostic/build/worker/shim.mjs
          test -s .cache/worker-diagnostic/build/index.js
          find .cache/worker-diagnostic/build -type f -name '*.wasm' -size +0c | grep -q .
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.lock
      - name: Install the locked SDK validator
        run: |
          python3 -m venv .cache/e2e-venv
          .cache/e2e-venv/bin/pip install -r tests/e2e/requirements.lock
      - name: Run fixture journeys against the retained Worker
        env:
          WORKER_BUILD_DIR: .cache/worker-diagnostic/build
          MAGENTS_SCHEMA_PYTHON: .cache/e2e-venv/bin/python
        run: |
          set -euo pipefail
          npm run test:worker 2>&1 | tee .temp/worker-diagnostic/worker.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: worker-diagnostic-${{ github.run_id }}
          path: |
            .temp/worker-diagnostic/provenance.json
            .temp/worker-diagnostic/worker.log
          if-no-files-found: warn
          retention-days: 3
