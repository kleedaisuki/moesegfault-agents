name: CI
run-name: MCP legacy compatibility increment
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: mcp-compat-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c
        with:
          shared-key: worker
          cache-all-crates: true
          cache-on-failure: true
      - run: cargo fmt --check
      - run: cargo test --locked -p agents-worker --lib legacy_negotiation_is_metadata_only_and_modern_errors_never_downgrade -- --nocapture
      - run: cargo check --locked -p agents-worker --target wasm32-unknown-unknown
      - run: cargo install --locked worker-build --version 0.8.7
      - run: worker-build --release
        working-directory: crates/agents-worker
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/bundle-worker.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: worker
          path: crates/agents-worker/build
          retention-days: 7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/e2e/requirements-current.lock
      - run: |
          python3 -m venv .cache/e2e-current-venv
          .cache/e2e-current-venv/bin/pip install -r tests/e2e/requirements-current.lock
      - name: Run only the new legacy handshake approval and read-only tail
        run: node --test --test-reporter=tap tests/worker/mcp.test.mjs
        env:
          MAGENTS_MCP_CASE: mcp_legacy
          MAGENTS_CURRENT_SCHEMA_PYTHON: .cache/e2e-current-venv/bin/python
          MAGENTS_TEST_EXPECTED_BUILD: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: mcp-compat-receipts
          path: .temp/mcp-worker-*/receipt*.json
          if-no-files-found: warn
          retention-days: 7
