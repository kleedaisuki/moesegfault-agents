name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      worker: ${{ steps.paths.outputs.worker }}
      dashboard: ${{ steps.paths.outputs.dashboard }}
      container: ${{ steps.paths.outputs.container }}
      tooling: ${{ steps.paths.outputs.tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/ci-changes.mjs

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace --exclude agents-worker
      - run: python3 -m unittest discover -s tests -p 'test_*sql.py' -v
      - run: cargo clippy --locked --workspace --exclude agents-worker --all-targets -- -D warnings

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/dashboard/package-lock.json') }}
      - run: npx playwright install --with-deps --only-shell chromium
        timeout-minutes: 10
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard
          path: apps/dashboard/dist
          retention-days: 7

  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: worker
          cache-all-crates: true
          cache-on-failure: true
      - run: cargo check --locked -p agents-worker --target wasm32-unknown-unknown
      - run: cargo test --locked -p agents-worker --lib
      - run: cargo install --locked worker-build --version 0.8.7
      - run: worker-build --release
        working-directory: crates/agents-worker
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/bundle-worker.mjs
      - run: npm run test:worker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: worker
          path: crates/agents-worker/build
          retention-days: 7

  container:
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: container/Dockerfile
          load: true
          tags: magents-workspace:acceptance
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,mode=max,scope=workspace
      - run: |
          python3 -m venv .cache/e2e-venv
          .cache/e2e-venv/bin/pip install -r tests/e2e/requirements.lock
          .cache/e2e-venv/bin/python -m pytest tests/e2e/test_workspace_daemon.py -ra -rP -o cache_dir=.cache/pytest --basetemp=.temp/pytest
        env:
          MAGENTS_DAEMON_IMAGE: magents-workspace:acceptance

  tooling:
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:tooling
      - run: |
          python3 -m venv .cache/e2e-venv
          .cache/e2e-venv/bin/pip install -r tests/e2e/requirements.lock
          .cache/e2e-venv/bin/python -m pytest tests/e2e/test_sdk_contract.py tests/e2e/test_daemon_harness.py scripts/perf/test_measure.py -ra -o cache_dir=.cache/pytest --basetemp=.temp/pytest
